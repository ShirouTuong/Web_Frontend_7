<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo layout với HTML5 và CSS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 10px;
        }

        nav {
            background-color: #333;
            overflow: hidden;
            margin-bottom: 10px;
        }

        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        aside {
            flex: 1;
            background-color: #e2e2e2;
            padding: 15px;
            min-height: 300px;
        }

        section {
            flex: 3;
            background-color: white;
            padding: 15px;
            border: 1px solid #ccc;
        }

        article {
            background-color: #fafafa;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            clear: both;
        }
    </style>
</head>
<body>

    <header>
        <h1>Header Title</h1>
    </header>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Bài viết</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Liên hệ</a>
    </nav>

    <div class="container">
        <aside>
            <h3>Aside / Sidebar</h3>
            <ul>
                <li>Danh mục 1</li>
                <li>Danh mục 2</li>
                <li>Danh mục 3</li>
            </ul>
        </aside>

        <section>
            <h2>Section Content</h2>
            <article>
                <h3>Article 1</h3>
                <p>Nội dung bài viết thứ nhất...</p>
            </article>
            <article>
                <h3>Article 2</h3>
                <p>Nội dung bài viết thứ hai...</p>
            </article>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Bản quyền thuộc về trang web</p>
    </footer>

</body>
</html>
